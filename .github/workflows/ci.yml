name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests, migration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check app tests migrations
      - name: Format check
        run: ruff format --check app tests migrations
      - name: Tests
        run: python -m pytest -o addopts="" -q
      - name: Migrations apply to an empty database
        run: alembic upgrade head
        env:
          HERMES_DATABASE_URL: sqlite:///./ci.db

  web:
    name: Web (types, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint src e2e
      - name: Build
        run: npm run build

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Create backend virtualenv (the e2e launcher expects backend/.venv)
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        working-directory: web
        run: npm run e2e
        env:
          CI: "true"
      - name: Upload traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            web/e2e/results
            web/e2e/screenshots
          if-no-files-found: ignore
          retention-days: 7
